name: Build APKs
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --stacktrace
      - run: |
          mkdir out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/
          cp tv/build/outputs/apk/debug/tv-debug.apk out/
      - uses: actions/upload-artifact@v4
        with:
          name: GyroCursor-apks
          path: out/
